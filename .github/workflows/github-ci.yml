name: CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # deliver feedback for all matrix combinations
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest]
        compiler: [gcc, clang, msvc]

        include:
          # TODO: https://github.com/conan-io/conan/issues/18059
          - compiler: msvc
            preset_name: conan-default
            c_compiler: cl
            cxx_compiler: cl

          - compiler: gcc
            preset_name: conan-release
            c_compiler: gcc
            cxx_compiler: g++

          - compiler: clang
            preset_name: conan-release
            c_compiler: clang
            cxx_compiler: clang++

        exclude:
          - os: windows-latest
            compiler: gcc

          - os: windows-latest
            compiler: clang

          - os: ubuntu-latest
            compiler: msvc


    env:
      CC: ${{matrix.c_compiler}}
      CXX: ${{matrix.cxx_compiler}}


    steps:
    - uses: actions/checkout@v4

    - name: Setup conan package manager
      uses: conan-io/setup-conan@v1
        
    - name: Conan install - download and/or build libraries
      run: conan install . --build=missing -pr:a .github/workflows/conan_base -pr:a .github/workflows/conan_${{matrix.compiler}}

    - name: CMake configure - generate build system files
      run: cmake --preset=conan-release

    - name: CMake build - build C/C++ code
      run: cmake --build --preset=${{matrix.preset_name}}

    - name: Tests run
      run: build/Release/tbbss_tests
