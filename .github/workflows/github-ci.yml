name: CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # deliver feedback for all matrix combinations
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest]
        compiler: [gcc, clang, msvc]
        exclude:
          - os: windows-latest
            compiler: gcc
          - os: windows-latest
            compiler: clang
          - os: ubuntu-latest
            compiler: msvc

    steps:
    - uses: actions/checkout@v4

    - name: Setup conan package manager
      uses: conan-io/setup-conan@v1
        
    - name: Conan install - download and/or build libraries
      run: conan install . --build=missing -pr .github/workflows/conan_base -pr .github/workflows/conan_${{matrix.compiler}}

    - name: CMake configure - generate build system files
      run: cmake --preset=conan-release

    - name: CMake build - build C/C++ code
      run: cmake --build --preset=conan-release

    - name: Tests run
      run: build/Release/tbbss_tests
